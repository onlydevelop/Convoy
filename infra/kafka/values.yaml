# Bitnami Kafka chart values for single-node KRaft mode (implementation-spec.md §4).
# KRaft combined mode: controller nodes also act as brokers, so broker.replicaCount
# stays at 0 and controller.replicaCount is the only node count that matters.
#
# image.repository points at bitnamilegacy/kafka because Broadcom pulled the free
# bitnami/* images off Docker Hub in Aug 2025, leaving only the "latest" tag there;
# the full pinned-tag catalog now lives under bitnamilegacy/*.
image:
  repository: bitnamilegacy/kafka

kraft:
  enabled: true

controller:
  replicaCount: 1
  # Default heapOpts is -XX:InitialRAMPercentage=75 -XX:MaxRAMPercentage=75,
  # which ties the JVM's heap ceiling to whatever the container memory
  # *limit* happens to be. That's why raising the limit (1536Mi -> 2560Mi)
  # didn't fix the growing container_memory_working_set_bytes -- it just
  # raised the heap ceiling to ~1920Mi along with it, giving G1 more room
  # to keep growing before IHOP (35% of old-gen occupancy) pressures it
  # into reclaiming. Working set kept climbing past 1.1GiB with no sign of
  # stopping. Pinning an explicit, modest Xmx decouples heap sizing from
  # the container limit entirely, so G1 is forced to actually collect
  # well before using all the room the limit provides -- a real plateau
  # instead of a slower climb toward a higher ceiling.
  heapOpts: "-Xms512m -Xmx1024m"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      # 1024Mi heap ceiling + metaspace/thread-stacks/page-cache for the
      # 10-min segment rolls (infra/kafka/values.yaml log.roll.ms below):
      # 1536Mi gives real margin above that without relying on container
      # size to also cap the heap.
      memory: 1536Mi
  persistence:
    size: 2Gi

broker:
  replicaCount: 0

listeners:
  client:
    protocol: PLAINTEXT

# Single-node cluster: Kafka's internal __consumer_offsets/__transaction_state
# topics default to replication-factor 3, which can never succeed with only
# one broker. Left at the default, auto-creation of __consumer_offsets loops
# forever and no consumer group can ever find a coordinator - every consumer
# (e.g. processing-service) subscribes successfully but never receives a
# single record. Mirrors the replication-factor 1 already used for
# vehicle.telemetry.raw in topic-init-job.yaml.
overrideConfiguration:
  offsets.topic.replication.factor: 1
  transaction.state.log.replication.factor: 1
  transaction.state.log.min.isr: 1
  # Broker-wide default so any topic without its own retention.ms override
  # (currently just vehicle.telemetry.raw) ages out after 20 minutes instead
  # of the 7-day default -- keeps the single 2Gi PVC from filling up during
  # sustained load-generator runs. Deletion is still bounded by
  # log.retention.check.interval.ms (default 5 min), so data can briefly
  # outlive 20 minutes before the next check sweeps it.
  log.retention.minutes: 20
  # retention.ms only makes a segment *eligible* for deletion once it's
  # rolled (closed) -- it never touches the active segment currently being
  # appended to. Left at the 168h/1GiB defaults, a single partition at this
  # topic's throughput never rolls, so retention silently did nothing and
  # disk usage grew unbounded (observed: ~46GiB and climbing ~2GiB/hour on
  # what should be a 20-minute retention window).
  #
  # Roll every 10 minutes -- under the 20 min retention (so there's always
  # at least one rolled, deletable segment behind the active one), but not
  # so frequent that it churns memory: an earlier 5-minute setting rolled
  # 12 partitions' worth of segments (each closing/reopening 10MB
  # pre-allocated index + timeindex files) often enough to visibly grow
  # both JVM heap and page-cache working set within the first 35 minutes
  # of uptime. 10 minutes halves that churn while still keeping retention
  # working.
  log.roll.ms: 600000
