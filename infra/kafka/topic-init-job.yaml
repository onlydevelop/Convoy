apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: convoy
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topic
          # bitnamilegacy, not bitnami: Broadcom pulled pinned tags from the free
          # bitnami/* Docker Hub images in Aug 2025 (see infra/kafka/values.yaml).
          image: bitnamilegacy/kafka:3.8
          command:
            - /bin/bash
            - -c
            - >
              kafka-topics.sh --create --if-not-exists
              --topic vehicle.telemetry.raw
              --partitions 12
              --replication-factor 1
              --bootstrap-server kafka.convoy.svc.cluster.local:9092
