# Scrapes the convoy app services' Actuator Prometheus endpoint directly off
# the pods. PodMonitor (rather than ServiceMonitor) because load-generator
# and processing-service have no Service object — nothing in the cluster
# calls them over HTTP, so none was ever created for them.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: convoy-services
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - convoy
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - ingestion-service
          - load-generator
          - processing-service
  # Copies the pod's "app" label onto each scraped sample, so the Grafana
  # dashboard (infra/observability/grafana-dashboards.yaml) can filter/group
  # per service — otherwise a PodMonitor's target has no label identifying
  # which of the three services it came from.
  podTargetLabels:
    - app
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
