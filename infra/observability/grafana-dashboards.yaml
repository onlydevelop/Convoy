# Grafana dashboard(s) auto-provisioned via kube-prometheus-stack's Grafana
# sidecar: it watches for ConfigMaps labeled grafana_dashboard=1 in this
# namespace (default sidecar.dashboards config, unchanged in values.yaml)
# and loads their "*.json" data keys as dashboards — no manual Grafana UI
# import needed after `make deploy-observability`.
#
# The container CPU/memory panels deliberately don't filter on
# container!="" — this cluster's kubelet/cAdvisor (k3s on Rancher Desktop's
# Alpine VM) only emits the whole-pod cgroup rollup (no container label at
# all, not even ""), so that filter silently zeroed both panels. Since every
# convoy pod runs exactly one container, summing without the filter gives
# the same number and works regardless of whether a given cluster's cAdvisor
# does emit per-container rows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: convoy-jvm-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  convoy-jvm.json: |
    {
      "uid": "convoy-jvm",
      "title": "Convoy - CPU, Memory & G1 GC",
      "tags": ["convoy", "jvm"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "app",
            "type": "query",
            "label": "Service",
            "query": "label_values(process_cpu_usage, app)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        { "id": 20, "type": "row", "title": "Throughput", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
        {
          "id": 21, "type": "timeseries", "title": "Requests per second (all services)",
          "description": "Each service's request-rate metric is different by design: ingestion-service measures inbound HTTP it receives, load-generator measures outbound HTTP it sends, processing-service measures Kafka records it consumes. Not filtered by the Service dropdown above -- always shows all three so they're comparable on one graph.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{app=\"ingestion-service\", uri=\"/v1/telemetry\"}[5m]))",
              "legendFormat": "ingestion-service (inbound HTTP)"
            },
            {
              "refId": "B",
              "expr": "sum(rate(http_client_requests_seconds_count{app=\"load-generator\", uri=\"/v1/telemetry\"}[5m]))",
              "legendFormat": "load-generator (outbound HTTP)"
            },
            {
              "refId": "C",
              "expr": "sum(rate(spring_kafka_listener_seconds_count{app=\"processing-service\"}[5m]))",
              "legendFormat": "processing-service (Kafka records consumed)"
            }
          ]
        },

        { "id": 17, "type": "row", "title": "Threads & Process", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 } },
        {
          "id": 18, "type": "timeseries", "title": "JVM threads",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "jvm_threads_live_threads{app=~\"$app\"}", "legendFormat": "{{app}} live" },
            { "refId": "B", "expr": "jvm_threads_daemon_threads{app=~\"$app\"}", "legendFormat": "{{app}} daemon" },
            { "refId": "C", "expr": "jvm_threads_peak_threads{app=~\"$app\"}", "legendFormat": "{{app}} peak" }
          ]
        },
        {
          "id": 19, "type": "stat", "title": "Process uptime",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "process_uptime_seconds{app=~\"$app\"}", "legendFormat": "{{app}}" }
          ]
        },

        { "id": 1, "type": "row", "title": "Container Resources (cAdvisor)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 } },
        {
          "id": 2, "type": "timeseries", "title": "Container CPU usage (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"convoy\", pod=~\"$app.*\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Container memory working set",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"convoy\", pod=~\"$app.*\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },

        { "id": 22, "type": "row", "title": "Kafka (kafka-controller-0)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 } },
        {
          "id": 23, "type": "timeseries", "title": "Kafka container CPU usage (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"convoy\", pod=~\"kafka-controller.*\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 24, "type": "timeseries", "title": "Kafka container memory working set",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"convoy\", pod=~\"kafka-controller.*\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 25, "type": "timeseries", "title": "Kafka disk usage (data-kafka-controller-0 PVC)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "kubelet_volume_stats_used_bytes{namespace=\"convoy\", persistentvolumeclaim=~\"data-kafka-controller.*\"}",
              "legendFormat": "used"
            },
            {
              "refId": "B",
              "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"convoy\", persistentvolumeclaim=~\"data-kafka-controller.*\"}",
              "legendFormat": "capacity"
            }
          ]
        },
        {
          "id": 26, "type": "timeseries", "title": "Queue length (consumer lag, records behind)",
          "description": "Client-side lag reported by processing-service's Kafka consumer -- how many records on vehicle.telemetry.raw it hasn't caught up to yet, summed across partitions. This is a consumer-side proxy for Kafka's own queue depth; the Bitnami chart doesn't have its JMX/broker metrics exporter enabled, so there's no broker-side request-queue metric to graph directly.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kafka_consumer_fetch_manager_records_lag{app=\"processing-service\"}) by (topic)",
              "legendFormat": "{{topic}}"
            }
          ]
        },

        { "id": 4, "type": "row", "title": "JVM Process CPU", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 44 } },
        {
          "id": 5, "type": "timeseries", "title": "Process CPU usage (%)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 45 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "process_cpu_usage{app=~\"$app\"} * 100", "legendFormat": "{{app}} process" }
          ]
        },
        {
          "id": 6, "type": "timeseries", "title": "System CPU usage (%)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 45 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "system_cpu_usage{app=~\"$app\"} * 100", "legendFormat": "{{app}} node" }
          ]
        },

        { "id": 7, "type": "row", "title": "JVM Memory", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 53 } },
        {
          "id": 8, "type": "timeseries", "title": "Heap used vs max",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 54 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "jvm_memory_used_bytes{app=~\"$app\", area=\"heap\"}", "legendFormat": "{{app}} used" },
            { "refId": "B", "expr": "jvm_memory_max_bytes{app=~\"$app\", area=\"heap\"}", "legendFormat": "{{app}} max" }
          ]
        },
        {
          "id": 9, "type": "timeseries", "title": "Non-heap used",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 54 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "jvm_memory_used_bytes{app=~\"$app\", area=\"nonheap\"}", "legendFormat": "{{app}} {{id}}" }
          ]
        },
        {
          "id": 10, "type": "timeseries", "title": "G1 memory pools (Eden / Survivor / Old)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 62 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "jvm_memory_used_bytes{app=~\"$app\", id=~\"G1.*\"}", "legendFormat": "{{app}} {{id}}" }
          ]
        },

        { "id": 11, "type": "row", "title": "G1 Garbage Collection", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 70 } },
        {
          "id": 12, "type": "timeseries", "title": "GC pause rate by collection type",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 71 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "rate(jvm_gc_pause_seconds_count{app=~\"$app\"}[5m])", "legendFormat": "{{app}} {{gc}}/{{action}}" }
          ]
        },
        {
          "id": 13, "type": "timeseries", "title": "Time spent in GC (%)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 71 },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "rate(jvm_gc_pause_seconds_sum{app=~\"$app\"}[5m])", "legendFormat": "{{app}} {{gc}}" }
          ]
        },
        {
          "id": 14, "type": "timeseries", "title": "Max GC pause duration",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 79 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "jvm_gc_pause_seconds_max{app=~\"$app\"}", "legendFormat": "{{app}} {{gc}}/{{action}}" }
          ]
        },
        {
          "id": 15, "type": "timeseries", "title": "Allocation & promotion rate",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 79 },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "rate(jvm_gc_memory_allocated_bytes_total{app=~\"$app\"}[5m])", "legendFormat": "{{app}} allocated" },
            { "refId": "B", "expr": "rate(jvm_gc_memory_promoted_bytes_total{app=~\"$app\"}[5m])", "legendFormat": "{{app}} promoted (young->old)" }
          ]
        },
        {
          "id": 16, "type": "timeseries", "title": "Old gen live data size vs max (post full-GC)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 87 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "jvm_gc_live_data_size_bytes{app=~\"$app\"}", "legendFormat": "{{app}} live" },
            { "refId": "B", "expr": "jvm_gc_max_data_size_bytes{app=~\"$app\"}", "legendFormat": "{{app}} max" }
          ]
        }
      ]
    }
