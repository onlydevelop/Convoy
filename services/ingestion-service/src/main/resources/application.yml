server:
  port: 8080

spring:
  application:
    name: ingestion-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.fleet-ingestion.svc.cluster.local:9092}
    producer:
      acks: "1"

app:
  kafka:
    topic: ${INGESTION_TOPIC:vehicle.telemetry.raw}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
