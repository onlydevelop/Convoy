server:
  port: 8080

logging:
  file:
    name: ${LOG_FILE_NAME:logs/ingestion-service.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 100MB

spring:
  application:
    name: ingestion-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.convoy.svc.cluster.local:9092}
    producer:
      acks: "1"
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topic: ${INGESTION_TOPIC:vehicle.telemetry.raw}

management:
  server:
    # Separate port so actuator health checks have their own connector/thread
    # pool, isolated from the ingestion request pool. Otherwise, under load,
    # liveness/readiness probes queue behind backed-up /v1/telemetry requests
    # (each holding a thread for up to 3s waiting on the Kafka producer ack)
    # and time out against the 1s probe timeout even though the app is alive
    # -- kubelet then kills and restarts the container, which just repeats
    # the same saturation on the next boot. This was causing a crash loop.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
